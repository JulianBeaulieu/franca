name: release

# Day-first date tags like v14.07.2026 (and re-cut suffixes like v14.07.2026-2).
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Guard tag format (vDD.MM.YYYY, optional -N suffix)
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]{2}\.[0-9]{2}\.[0-9]{4}(-[0-9]+)?$'; then
            echo "Tag '$tag' is not a vDD.MM.YYYY release tag; skipping." >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        id: guard

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/julianbeaulieu/franca:${{ steps.guard.outputs.version }}
            ghcr.io/julianbeaulieu/franca:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
